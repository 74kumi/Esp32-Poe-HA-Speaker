name: KiCad checks

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kicad-checks:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0.5@sha256:182c8005cb775a2c448a4c18681d489f1ff472a761885eba3e08b07e3c0564de
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run KiCad checks
        run: ./scripts/run-kicad-checks.sh artifacts/kicad

      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kicad-reports
          path: artifacts/kicad
          if-no-files-found: warn
          retention-days: 14
